name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SESSION_SECRET: ci-session-secret-replace-in-production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Prepare database schema
        run: npm run db:push

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
