name: Feature request
description: Suggest an improvement for DDNS+
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
      placeholder: "I want to use DDNS+ with another DNS provider."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or workarounds.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or links when useful. Do not include secrets.
